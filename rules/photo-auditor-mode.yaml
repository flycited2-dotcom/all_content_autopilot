# Режим фотоаудитора. Читает photo_auditor/mode.py при каждой проверке — перезапуск не нужен.
#
# advisory — аудитор-помощник: проверяет, пишет замечания в @foto_auditor_bot,
#   но не останавливает контент-завод. Фото задерживается только на время
#   исправления подтверждённого видимого расхождения (repairs раз).
#   Сомнения, нехватка эталонов, сбой подключения и долгая проверка —
#   фото идёт дальше в превью с пометкой; публикует только владелец кнопкой ✅.
# gate — прежний строгий режим: без автоматического одобрения фото не выгружается.
mode: advisory
# Сколько исправлений по подтверждённому расхождению (0–2).
repairs: 1
# Сколько секунд фотоагент ждёт отчёт, прежде чем отпустить фото дальше (60–3600).
# Проверка при этом продолжается, отчёт придёт в бот аудитора.
wait_seconds: 900
