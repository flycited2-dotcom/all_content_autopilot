# Экспертный пост в группу ВК.
min_length: 400
max_length: 3200          # 3500 минус подвал системы (раздел сайта, телефон)
stop_words: [гарантирован, "лучший в мире", "лучшая в мире", "лучшее в мире", "без риска", "100%", кредит, рассрочк]  # основы: ищутся с начала слова
forbid_prices: true
require_sources: true
require_visual_prompt: true
forbid_links: true         # ссылок в тексте нет: источники — только в facts/source_urls; сайт и телефон добавляет система
